<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>花灯手作 · 3D 立体版</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      #artwork3d { width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
      #artwork3d:active { cursor: grabbing; }
    </style>
    <script defer src="three.min.js"></script>
    <script defer src="lantern3d.js"></script>
    <script defer src="app3d.js"></script>
    <script defer src="music.js"></script>
  </head>
  <body>
    <main class="studio">
      <header class="header">
        <div class="brand"><span class="seal">灯</span>花灯手作<small>一盏灯，一份心意 · 3D</small></div>
        <button class="quiet" id="collectionButton">我的花灯 <span id="count">0</span></button>
      </header>

      <section class="workspace" id="workshop">
        <section class="result-preview" id="resultPreview" aria-label="花灯纪念图" hidden>
          <p class="result-status" id="resultStatus" role="status">正在生成纪念图…</p>
          <img id="resultImage" width="1600" height="2000" alt="点亮后的花灯纪念图" hidden />
        </section>
        <div class="stage" id="stage">
          <div class="stage-heading"><span>灯下 · 立体手作</span><span id="stageLabel">01 / 扎灯骨</span></div>
          <div class="artwork" id="artwork"><canvas id="artwork3d"></canvas></div>
          <div class="stage-vignette" aria-hidden="true"></div>
          <div class="stage-hint" id="stageHint">拖动旋转·双指缩放·点击暂停转动</div>
        </div>

        <section class="workbench" aria-label="制作步骤">
          <div class="intro"><span class="eyebrow">THE LANTERN ATELIER · 3D</span><h2>亲手做一盏团圆</h2><p>扎骨、糊纸、描花、系穗，最后点亮。</p></div>
          <nav class="steps" id="steps" aria-label="制作进度"></nav>
          <div class="step-content">
            <div class="step-heading"><span id="stepNumber">第一道</span><h3 id="stepTitle">扎一副灯骨</h3></div>
            <p class="step-description" id="stepDescription"></p>
            <div class="options" id="options"></div>
            <div class="option-scrollbar" id="optionScrollbar" aria-hidden="true" hidden><span id="optionScrollThumb"></span></div>
            <div class="wish-fields" id="wishFields" hidden>
              <label for="lanternName">花灯名字</label>
              <input id="lanternName" maxlength="16" placeholder="春风照晚归" />
              <label for="blessing">心愿祝福</label>
              <input id="blessing" maxlength="32" placeholder="愿每次出发，都有温暖相伴" />
            </div>
          </div>
          <footer class="workbench-footer">
            <button class="back" id="backButton">上一步</button>
            <button class="primary" id="nextButton">糊上灯纸 <span>→</span></button>
            <button class="primary" id="generateButton" hidden>生成图片 →</button>
          </footer>
          <div class="result-actions" id="resultActions" hidden>
            <div class="poster-bg" id="posterBg">
              <span class="poster-bg-label">背景</span>
              <button class="bg-chip is-active" data-bg="paper" type="button">宣纸</button>
              <button class="bg-chip" data-bg="dark" type="button">深色</button>
              <label class="bg-chip bg-chip--file">自定义<input type="file" id="bgFile" accept="image/*" hidden /></label>
            </div>
            <button class="primary" id="downloadButton">保存高清纪念图 ↓</button>
            <button class="quiet" id="saveButton">收入收藏</button>
            <button class="quiet" id="restartButton">再做一盏</button>
          </div>
        </section>
      </section>

      <section class="collection" id="collection" hidden>
        <div class="collection-heading"><div><span class="eyebrow">MY LANTERNS</span><h2>灯火可亲</h2></div><button class="quiet" id="returnButton" hidden>← 返回手作</button></div>
        <div class="collection-grid" id="collectionGrid"></div>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
