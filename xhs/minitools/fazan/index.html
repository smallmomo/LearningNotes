<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>你的古风簪子</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>你的古风簪子</h1><div class="sub">选一支属于你的东方簪</div></header>
<main class="layout">
<section class="panel">
<div class="stage">
<svg id="preview" viewBox="0 0 320 560" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="watermark">你的古风簪子</div>
</div>
<div class="steps"><span class="step active">簪杆</span><span class="step">簪首</span><span class="step">点缀</span><span class="step">完成</span></div>
<div id="stepArea"></div>
<div class="nav"><button id="prevBtn" class="ghost">返回</button><button id="nextBtn">继续</button></div>
<div class="buttons"><button id="randomBtn" class="ghost">换一支</button><button id="exportBtn" class="ghost">导出图片</button></div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
